services:
  postgres:
    volumes: !override
      - ${MIROFISH_DATA_ROOT:?MIROFISH_DATA_ROOT is required}/postgres:/var/lib/postgresql/data

  redis:
    volumes: !override
      - ${MIROFISH_DATA_ROOT:?MIROFISH_DATA_ROOT is required}/redis:/data

  minio:
    volumes: !override
      - ${MIROFISH_DATA_ROOT:?MIROFISH_DATA_ROOT is required}/minio:/data

  api:
    image: ${MIROFISH_API_IMAGE:?MIROFISH_API_IMAGE is required}
    ports: !reset []
    healthcheck:
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 30s
    volumes: !override
      - ${MIROFISH_DATA_ROOT:?MIROFISH_DATA_ROOT is required}/manuscript-artifacts:/var/lib/mirofish/manuscript-artifacts

  web:
    image: ${MIROFISH_WEB_IMAGE:?MIROFISH_WEB_IMAGE is required}

  agent-runtime:
    image: &agent-runtime-image ${MIROFISH_AGENT_RUNTIME_IMAGE:?MIROFISH_AGENT_RUNTIME_IMAGE is required}

  agent-runtime-seed:
    image: *agent-runtime-image

  agent-runtime-asset:
    image: *agent-runtime-image

  agent-runtime-graph:
    image: *agent-runtime-image

  agent-runtime-worldline:
    image: *agent-runtime-image

  agent-runtime-character:
    image: *agent-runtime-image

  agent-runtime-reviewer:
    image: *agent-runtime-image

  agent-runtime-writer-planning:
    image: *agent-runtime-image

  legacy-import-worker:
    image: *agent-runtime-image

  pi-agent-runtime:
    image: &pi-agent-runtime-image ${MIROFISH_PI_AGENT_RUNTIME_IMAGE:?MIROFISH_PI_AGENT_RUNTIME_IMAGE is required}

  pi-agent-runtime-analysis:
    image: *pi-agent-runtime-image
