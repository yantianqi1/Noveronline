name: mirofish-novel

x-base-network: &base-network
  networks:
    - mirofish-infra

x-common-app-env: &common-app-env
  MIROFISH_ENV: ${MIROFISH_ENV:-development}
  MIROFISH_APP_NAME: ${MIROFISH_APP_NAME:-MiroFish-Novel}
  MIROFISH_API_PREFIX: ${MIROFISH_API_PREFIX:-/api/v2}
  MIROFISH_POSTGRES_DSN: ${MIROFISH_POSTGRES_DSN:-postgresql+psycopg://mirofish:change_me@postgres:5432/mirofish_novel}
  MIROFISH_REDIS_URL: ${MIROFISH_REDIS_URL:-redis://redis:6379/0}
  MIROFISH_MINIO_ENDPOINT: ${MIROFISH_MINIO_ENDPOINT:-minio:9000}
  MIROFISH_MINIO_ACCESS_KEY: ${MIROFISH_MINIO_ACCESS_KEY:-minioadmin}
  MIROFISH_MINIO_SECRET_KEY: ${MIROFISH_MINIO_SECRET_KEY:-change_me}
  MIROFISH_TEMPORAL_TARGET: ${MIROFISH_TEMPORAL_TARGET:-temporal:7233}

x-failing-app-service: &failing-app-service
  image: alpine:3.20
  restart: "no"
  command:
    [
      "sh",
      "-lc",
      "echo '[placeholder] this service is intentionally non-functional until a real runtime image is wired in.' >&2; exit 1",
    ]
  <<: *base-network

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mirofish_novel}
      POSTGRES_USER: ${POSTGRES_USER:-mirofish}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mirofish} -d ${POSTGRES_DB:-mirofish_novel}"]
      interval: 5s
      timeout: 5s
      retries: 12
    <<: *base-network

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    <<: *base-network

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    <<: *base-network

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${POSTGRES_USER:-mirofish}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-change_me}
      LOG_LEVEL: info
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    <<: *base-network

  temporal-ui:
    image: temporalio/ui:latest
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: ${TEMPORAL_TARGET:-temporal:7233}
    ports:
      - "${TEMPORAL_UI_PORT:-8088}:8080"
    <<: *base-network

  api-v2:
    <<:
      - *failing-app-service
    profiles:
      - apps
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      temporal:
        condition: service_started
    environment:
      <<: *common-app-env
      MIROFISH_HOST: ${MIROFISH_API_HOST:-0.0.0.0}
      MIROFISH_PORT: ${MIROFISH_API_PORT:-5102}
    ports:
      - "${MIROFISH_API_PORT:-5102}:5102"

  workflow-worker:
    <<:
      - *failing-app-service
    profiles:
      - apps
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      temporal:
        condition: service_started
    environment:
      <<: *common-app-env
      MIROFISH_WORKER_NAME: ${MIROFISH_WORKER_NAME:-workflow-worker}

  frontend-web:
    <<:
      - *failing-app-service
    profiles:
      - apps
    depends_on:
      api-v2:
        condition: service_started
    environment:
      <<: *common-app-env
      MIROFISH_WEB_PORT: ${MIROFISH_WEB_PORT:-3891}
    ports:
      - "${MIROFISH_WEB_PORT:-3891}:3891"

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  mirofish-infra:
    driver: bridge
