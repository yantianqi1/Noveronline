rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - name: api-unavailable-fires-and-recovers
    interval: 1m
    input_series:
      - series: 'up{job="mirofish-api",instance="api:8080"}'
        values: '0 0 0 0 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: MiroFishApiUnavailable
        exp_alerts:
          - exp_labels:
              alertname: MiroFishApiUnavailable
              instance: api:8080
              job: mirofish-api
              severity: critical
            exp_annotations:
              summary: MiroFish API metrics target is unavailable
      - eval_time: 5m
        alertname: MiroFishApiUnavailable
        exp_alerts: []
