services:
  backend:
    build: .
    ports:
      # Legacy compatibility service is local-only; SaaS traffic belongs to apps/api.
      - "127.0.0.1:3888:3888"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: sqlite:////app/data/mirofish.db
      APP_PORT: "3888"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mirofish
      POSTGRES_USER: mirofish
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mirofish}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
