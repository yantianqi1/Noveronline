[project]
name = "mirofish-novel-workflows"
version = "0.1.0"
description = "Temporal workflow worker package for MiroFish-Novel"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "temporalio>=1.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.4"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
