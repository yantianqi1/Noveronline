name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go-api:
    name: Go API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go test ./...

  web:
    name: Next Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  agent-runtime:
    name: Python Agent Runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -p no:cacheprovider tests -q

  infra:
    name: Infrastructure Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install infrastructure test dependencies
        run: python -m pip install pytest
      - name: Test infrastructure contracts
        run: python -m pytest -p no:cacheprovider infra/tests -q

  node-runtimes:
    name: Pi Runtime and Shared Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            apps/pi-agent-runtime/package-lock.json
            packages/shared-contracts/package-lock.json
      - name: Install Pi runtime dependencies
        working-directory: apps/pi-agent-runtime
        run: npm ci
      - name: Test Pi runtime
        working-directory: apps/pi-agent-runtime
        run: npm test
      - name: Typecheck Pi runtime
        working-directory: apps/pi-agent-runtime
        run: npm run typecheck
      - name: Build Pi runtime
        working-directory: apps/pi-agent-runtime
        run: npm run build
      - name: Install shared contract dependencies
        working-directory: packages/shared-contracts
        run: npm ci
      - name: Test shared contracts
        working-directory: packages/shared-contracts
        run: npm test
