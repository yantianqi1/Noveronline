version: 2
updates:
  - package-ecosystem: gomod
    directory: /apps/api
    schedule:
      interval: monthly
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: monthly
    groups:
      web-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/pi-agent-runtime
    schedule:
      interval: monthly
    groups:
      pi-runtime-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /packages/shared-contracts
    schedule:
      interval: monthly
    groups:
      shared-contract-dependencies:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /apps/agent-runtime
    schedule:
      interval: monthly
    groups:
      agent-runtime-dependencies:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    groups:
      legacy-backend-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
