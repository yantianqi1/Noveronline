openapi: 3.1.0
info:
  title: MiroFish-Novel API v2 Baseline
  version: 0.1.0
  description: |
    Rebuild contract baseline for operation, error, and health resources.
servers:
  - url: http://127.0.0.1:5102
tags:
  - name: system
  - name: operations
  - name: workspaces
  - name: llm
  - name: graph
  - name: archive
  - name: writer
  - name: worldline
paths:
  /api/v2/health:
    get:
      operationId: getHealth
      tags: [system]
      summary: API health probe
      responses:
        "200":
          description: API is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /api/v2/operations/{operationId}:
    get:
      operationId: getOperation
      tags: [operations]
      summary: Query a durable operation
      parameters:
        - $ref: "#/components/parameters/OperationId"
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: Operation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResource"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "501":
          $ref: "#/components/responses/ErrorResponse"
  /api/v2/operations/{operationId}/steps/{stepId}:
    get:
      operationId: getOperationStepTrace
      tags: [operations]
      summary: Query a step trace by operation and step id
      parameters:
        - $ref: "#/components/parameters/OperationId"
        - $ref: "#/components/parameters/StepId"
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: Operation with step trace detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResource"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "501":
          $ref: "#/components/responses/ErrorResponse"
  /api/v2/operations/{operationId}/events:
    get:
      operationId: listOperationEvents
      tags: [operations]
      summary: Query a persisted operation event log
      parameters:
        - $ref: "#/components/parameters/OperationId"
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: Event log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperationEvent"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "501":
          $ref: "#/components/responses/ErrorResponse"
  /api/v2/operations/{operationId}/stream:
    get:
      operationId: streamOperationEvents
      tags: [operations]
      summary: Subscribe to operation SSE events
      parameters:
        - $ref: "#/components/parameters/OperationId"
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "501":
          $ref: "#/components/responses/ErrorResponse"
  /api/v2/workspaces/{workspaceId}/graph-builds:
    post:
      operationId: startGraphBuild
      tags: [graph]
      summary: Start a graph build workflow
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TraceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Graph build operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResource"
        "501":
          $ref: "#/components/responses/ErrorResponse"
  /api/v2/workspaces/{workspaceId}/graph:
    get:
      operationId: getWorkspaceGraph
      tags: [graph]
      summary: Query the current graph projection
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: Graph projection
          content:
            application/json:
              schema:
                type: object
        "501":
          $ref: "#/components/responses/ErrorResponse"
  /api/v2/workspaces/{workspaceId}/graph/nodes/{nodeId}:
    get:
      operationId: getGraphNode
      tags: [graph]
      summary: Query one graph node
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: Graph node detail
          content:
            application/json:
              schema:
                type: object
        "501":
          $ref: "#/components/responses/ErrorResponse"
  /api/v2/workspaces/{workspaceId}/graph-template-configs/{templateKey}:
    patch:
      operationId: updateGraphTemplateConfig
      tags: [graph]
      summary: Update a graph template config
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TemplateKey"
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: Template config updated
          content:
            application/json:
              schema:
                type: object
        "501":
          $ref: "#/components/responses/ErrorResponse"
  /api/v2/workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: List workspaces
      parameters:
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: Workspace list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "501":
          $ref: "#/components/responses/ErrorResponse"
  /api/v2/workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      tags: [workspaces]
      summary: Query one workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: Workspace detail
          content:
            application/json:
              schema:
                type: object
        "501":
          $ref: "#/components/responses/ErrorResponse"
  /api/v2/workspaces/{workspaceId}/ingests:
    post:
      operationId: createWorkspaceIngest
      tags: [workspaces]
      summary: Create one ingest workflow
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TraceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Ingest operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResource"
        "501":
          $ref: "#/components/responses/ErrorResponse"
  /api/v2/llm/settings:
    get:
      operationId: getLlmSettings
      tags: [llm]
      summary: Query llm facility settings
      parameters:
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: LLM settings snapshot
          content:
            application/json:
              schema:
                type: object
        "501":
          $ref: "#/components/responses/ErrorResponse"
  /api/v2/llm/channels:
    post:
      operationId: createLlmChannel
      tags: [llm]
      summary: Create llm channel
      parameters:
        - $ref: "#/components/parameters/TraceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: LLM channel created
          content:
            application/json:
              schema:
                type: object
        "501":
          $ref: "#/components/responses/ErrorResponse"
  /api/v2/llm/channels/{channelKey}:
    patch:
      operationId: updateLlmChannel
      tags: [llm]
      summary: Update llm channel
      parameters:
        - $ref: "#/components/parameters/ChannelKey"
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: LLM channel updated
          content:
            application/json:
              schema:
                type: object
        "501":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteLlmChannel
      tags: [llm]
      summary: Delete llm channel
      parameters:
        - $ref: "#/components/parameters/ChannelKey"
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: LLM channel deleted
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "501":
          $ref: "#/components/responses/ErrorResponse"
  /api/v2/llm/channels/{channelKey}/model-syncs:
    post:
      operationId: syncLlmModels
      tags: [llm]
      summary: Start llm model sync
      parameters:
        - $ref: "#/components/parameters/ChannelKey"
        - $ref: "#/components/parameters/TraceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Model sync accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResource"
        "501":
          $ref: "#/components/responses/ErrorResponse"
  /api/v2/llm/module-bindings/{moduleKey}:
    put:
      operationId: bindLlmModule
      tags: [llm]
      summary: Bind module to llm channel/model
      parameters:
        - $ref: "#/components/parameters/ModuleKey"
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: Module binding updated
          content:
            application/json:
              schema:
                type: object
        "501":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteLlmModuleBinding
      tags: [llm]
      summary: Delete module binding
      parameters:
        - $ref: "#/components/parameters/ModuleKey"
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: Module binding deleted
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "501":
          $ref: "#/components/responses/ErrorResponse"
  /api/v2/llm/activity:
    get:
      operationId: getLlmActivity
      tags: [llm]
      summary: Query llm activity
      parameters:
