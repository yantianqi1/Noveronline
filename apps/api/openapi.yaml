components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
    ChannelKey:
      name: channelKey
      in: path
      required: true
      schema:
        type: string
    ModuleKey:
      name: moduleKey
      in: path
      required: true
      schema:
        type: string
    ArchiveId:
      name: archiveId
      in: path
      required: true
      schema:
        type: string
    DraftId:
      name: draftId
      in: path
      required: true
      schema:
        type: string
    PreparationId:
      name: preparationId
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
    AutoEvolutionId:
      name: autoEvolutionId
      in: path
      required: true
      schema:
        type: string
    StepId:
      name: stepId
      in: path
      required: true
      schema:
        type: string
    TemplateKey:
      name: templateKey
      in: path
      required: true
      schema:
        type: string
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
  responses:
    ErrorResponse:
      description: Stable error payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        version:
          type: string
    ApiError:
      type: object
      required: [code, message, details, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        retryable:
          type: boolean
    ErrorResponse:
      type: object
      required: [trace_id, error]
      properties:
        trace_id:
          type: string
        error:
          $ref: "#/components/schemas/ApiError"
    OperationStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    OperationStepStatus:
      type: string
      enum: [pending, running, succeeded, failed, skipped]
    OperationStep:
      type: object
      required: [step_id, stage, status, progress_percent]
      properties:
        step_id:
          type: string
        stage:
          type: string
        status:
          $ref: "#/components/schemas/OperationStepStatus"
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
        message:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        elapsed_ms:
          type: integer
          nullable: true
    OperationEvent:
      type: object
      required: [event_id, operation_id, type, emitted_at, payload]
      properties:
        event_id:
          type: string
        operation_id:
          type: string
        type:
          type: string
          enum:
            - operation.started
            - operation.progress
            - operation.step.updated
            - operation.completed
            - operation.failed
        emitted_at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
    OperationResource:
      type: object
      required:
        - operation_id
        - trace_id
        - status
        - progress_percent
        - retryable
        - steps
      properties:
        operation_id:
          type: string
        trace_id:
          type: string
        status:
          $ref: "#/components/schemas/OperationStatus"
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
        message:
          type: string
          nullable: true
        retryable:
          type: boolean
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        steps:
          type: array
          items:
            $ref: "#/components/schemas/OperationStep"
