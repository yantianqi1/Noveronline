  /api/v2/workspaces/{workspaceId}/reviewer-rules:
    get:
      operationId: getReviewerRules
      tags: [writer]
      summary: Query reviewer rules
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TraceId"
      responses:
        "200":
          description: Reviewer rules
          content:
            application/json:
              schema:
                type: object
        "501":
          $ref: "#/components/responses/ErrorResponse"
    put:
      operationId: saveReviewerRules
      tags: [writer]
      summary: Save reviewer rules
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/TraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                custom_prompt:
                  type: string
              required: [custom_prompt]
      responses:
        "200":
          description: Reviewer rules saved
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "501":
          $ref: "#/components/responses/ErrorResponse"
