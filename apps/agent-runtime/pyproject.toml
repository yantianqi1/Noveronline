[project]
name = "mirofish-agent-runtime"
version = "0.1.0"
description = "MiroFish SaaS Python agent runtime worker"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43.0.0",
    "pydantic>=2.0.0",
    "pillow>=11.0.0",
    "psycopg[binary]>=3.2.0",
    "pypdfium2>=4.30.0",
    "pytesseract>=0.3.13",
    "temporalio>=1.9.0",
    "pypdf>=6.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mirofish_agents"]
